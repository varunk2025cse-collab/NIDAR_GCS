[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nidar-gcs-backend"
version = "0.1.0"
description = "NIDAR RescueSwarm — Ground Control Station backend for a real PX4/Pixhawk multi-drone fleet"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "psycopg[binary]>=3.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "mavsdk>=2.0.0",
    "pymavlink>=2.4.41",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "anyio>=4.6",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    # FastAPI dependency injection is function calls in defaults by design.
    "B008",
    # PEP 695 generics. The project targets 3.12+, but the Generic[T] form
    # keeps the modules importable on 3.11 for tooling that has not caught up.
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
# The fake adapter parks a stream on a long sleep to model a quiet telemetry
# channel; an Event would not represent "the aircraft simply is not sending
# this" any better.
"tests/fakes.py" = ["ASYNC110"]
